# Standalone deployment (no Home Assistant Supervisor required).
#
#   docker compose up -d --build
#   open http://<this-host>:8099
#
# ScreenScraper credentials and your SMB share details are entered in
# the app's own Settings tab after it's up -- nothing to configure here.

services:
  anbernic-manager:
    build: ./anbernic-manager
    container_name: anbernic-manager
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      - anbernic-manager-data:/data
    cap_add:
      - SYS_ADMIN   # needed for the built-in SMB-mount feature
    security_opt:
      - apparmor:unconfined

volumes:
  anbernic-manager-data:
