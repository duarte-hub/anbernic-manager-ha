name: "Anbernic Manager"
version: "0.1.5"
slug: "anbernic-manager"
description: "Scrape metadata & artwork for your Anbernic/Knulli ROM library via ScreenScraper, from a web UI."
url: "https://github.com/duarte-hub/anbernic-manager-ha"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8099
ingress_entry: "/"
panel_icon: mdi:gamepad-variant-outline
panel_title: "Anbernic Manager"

# Needed so the app can mount your Knulli SMB share itself with `mount -t
# cifs` (see README). If you only ever use "local path" mode -- i.e. you
# bind the ROMs folder in yourself under /share or /media -- you can
# remove `privileged` and `apparmor` and add the granular map entries
# below instead.
#
# SYS_ADMIN is what the mount() syscall itself requires; DAC_READ_SEARCH
# and apparmor: false are what mount.cifs needs internally to drop
# capabilities after mounting (without them it fails with "mount failed
# (exit 2): Unable to apply new capability set."). `full_access: true`
# does NOT reliably grant these under the current Supervisor -- use the
# explicit list instead.
#
# IMPORTANT: both `privileged` and `apparmor` only take effect once this
# app's "Protection mode" toggle (Info tab in Home Assistant) is turned
# off -- with it on, these settings are silently ignored.
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
apparmor: false

map:
  - type: share
    read_only: false
  - type: media
    read_only: false
  - type: data
    read_only: false

options:
  screenscraper_username: ""
  screenscraper_password: ""
schema:
  screenscraper_username: "str?"
  screenscraper_password: "password?"
